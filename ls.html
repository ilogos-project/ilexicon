<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LS拉汉词典 | iLexicon</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container nav-container">
            <div class="nav-brand">
                <a href="index.html" class="logo-link">
                    <i class="fas fa-book-open logo-icon"></i>
                    <span class="logo-text">iLexicon</span>
                </a>
            </div>
            <div class="nav-menu">
                <a href="ls.html" class="nav-link active">LS拉汉词典</a>
                <a href="magnum.html" class="nav-link">大辞典</a>
            </div>
        </div>
    </nav>

    <header class="hero">
        <div class="container">
            <h1 class="hero-title">LS拉汉词典</h1>
        </div>
    </header>

    <main class="container">
        <div class="lex-layout">
            <!-- 左栏：字母 + 词条列表 -->
            <aside class="lex-side">
                <div class="toolbar">
                    <input id="search" class="search-box" type="text" placeholder="检索拉丁头词…" autocomplete="off">
                </div>
                <div id="alpha" class="alpha-bar"></div>
                <div id="meta" class="result-meta"></div>
                <div id="results" class="entry-list"></div>
            </aside>

            <!-- 中栏：LS 原文词条 -->
            <section class="lex-main">
                <div id="detail" class="detail"></div>
            </section>

            <!-- 右栏：汉译 -->
            <aside class="lex-zh">
                <div id="zh-panel" class="zh-panel"></div>
            </aside>
        </div>
    </main>

    <footer>
        <div class="container footer-inner">
            <span>LS拉汉词典 · 初稿待校</span>
            <span>书证保留拉丁原文与出处</span>
        </div>
    </footer>

    <script src="assets/js/ls.js"></script>
</body>
</html>
